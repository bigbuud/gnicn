<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gnicn</title>
<style>
  :root { color-scheme: dark; --bg:#0f1115; --panel:#181b22; --text:#e8eaed; --muted:#8b93a1; --accent:#4f8cff; --danger:#e5484d; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  #stage { flex: 1; min-height: 0; display: flex; background: #000; position: relative; }
  video { width: 100%; height: 100%; background: #000; object-fit: contain; }
  #empty { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: var(--muted); font-size: 1.1rem; text-align: center; padding: 1rem; }
  #bar { background: var(--panel); padding: .6rem .8rem calc(.6rem + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: .5rem; }
  #info { display: flex; justify-content: space-between; gap: 1rem; font-size: .9rem; }
  #name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #count { color: var(--muted); white-space: nowrap; }
  #msg { color: var(--muted); font-size: .8rem; min-height: 1em; }
  #btns { display: flex; gap: .5rem; flex-wrap: wrap; }
  button { background: #262b36; color: var(--text); border: 0; border-radius: 8px; padding: .65rem 1rem; font-size: 1rem; cursor: pointer; }
  button:hover { background: #313847; }
  button:active { transform: scale(.97); }
  button.primary { background: var(--accent); }
  button.danger { background: var(--danger); margin-left: auto; }
  button.on { outline: 2px solid var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  @media (max-width: 520px) { button { flex: 1 1 30%; padding: .8rem .4rem; } button.danger { margin-left: 0; } }
</style>
</head>
<body>
<div id="stage">
  <video id="v" controls playsinline autoplay></video>
  <div id="empty">Geen video's gevonden in de map.</div>
</div>
<div id="bar">
  <div id="info"><span id="name">…</span><span id="count"></span></div>
  <div id="msg"></div>
  <div id="btns">
    <button id="prev" title="Vorige (P)">⏮ Vorige</button>
    <button id="next" class="primary" title="Volgende (N)">Volgende ⏭</button>
    <button id="mode" title="Willekeurig / op volgorde (R)">🔀 Willekeurig</button>
    <button id="rescan" title="Map opnieuw inlezen">↻</button>
    <button id="del" class="danger" title="Wissen (Delete)">🗑 Wissen</button>
  </div>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const v = $('v'), nameEl = $('name'), countEl = $('count'), msgEl = $('msg');
  let files = [], order = [], idx = 0;
  let random = (localStorage.getItem('vs.random') ?? '1') === '1';
  let cfg = { allowDelete: true, trash: false };
  let errorStreak = 0;

  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const say = (t) => { msgEl.textContent = t || ''; };
  const cur = () => order[idx];

  function buildOrder(keep) {
    if (random) {
      order = shuffle(files.slice());
      if (keep) { const i = order.indexOf(keep); if (i > 0) [order[0], order[i]] = [order[i], order[0]]; }
      else if (order.length > 1 && cur === undefined) { /* niets */ }
      idx = 0;
    } else {
      order = files.slice();
      idx = keep ? Math.max(0, order.indexOf(keep)) : 0;
    }
  }

  function render() {
    const has = order.length > 0;
    $('empty').style.display = has ? 'none' : 'flex';
    v.style.visibility = has ? 'visible' : 'hidden';
    ['prev', 'next', 'del'].forEach((id) => $(id).disabled = !has);
    $('del').style.display = cfg.allowDelete ? '' : 'none';
    $('mode').textContent = random ? '🔀 Willekeurig' : '➡ Op volgorde';
    $('mode').classList.toggle('on', random);
    if (has) {
      nameEl.textContent = cur();
      nameEl.title = cur();
      countEl.textContent = `${idx + 1} / ${order.length}`;
      document.title = cur().split('/').pop();
    } else {
      nameEl.textContent = '–'; countEl.textContent = ''; document.title = 'gnicn';
    }
  }

  function play() {
    if (!order.length) { v.removeAttribute('src'); v.load(); render(); return; }
    v.src = '/video?path=' + encodeURIComponent(cur());
    render();
    const p = v.play();
    if (p && p.catch) p.catch(() => say('Druk op afspelen om te starten (browser blokkeert autoplay).'));
    if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: cur().split('/').pop() });
  }

  function next() {
    if (!order.length) return;
    if (idx + 1 < order.length) idx++;
    else {
      const last = cur();
      buildOrder();
      if (random && order.length > 1 && order[0] === last) [order[0], order[1]] = [order[1], order[0]];
    }
    play();
  }
  function prev() {
    if (!order.length) return;
    idx = idx > 0 ? idx - 1 : order.length - 1;
    play();
  }

  async function del() {
    if (!order.length || !cfg.allowDelete) return;
    const f = cur();
    const what = cfg.trash ? 'verplaatsen naar de prullenmand' : 'DEFINITIEF wissen';
    if (!confirm(`${what}?\n\n${f}`)) return;
    v.pause();
    try {
      const r = await fetch('/api/video?path=' + encodeURIComponent(f), { method: 'DELETE' });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || r.status);
      files = files.filter((x) => x !== f);
      order.splice(idx, 1);
      if (idx >= order.length) idx = 0;
      say(cfg.trash ? 'Verplaatst naar prullenmand.' : 'Gewist.');
      play();
    } catch (e) {
      say('Wissen mislukt: ' + e.message);
      v.play().catch(() => {});
    }
  }

  async function load(keep) {
    say('Map inlezen…');
    const r = await fetch('/api/list');
    files = (await r.json()).files;
    buildOrder(keep);
    say(files.length ? '' : 'Geen video\'s gevonden.');
    play();
  }

  v.addEventListener('ended', () => { errorStreak = 0; next(); });
  v.addEventListener('playing', () => { errorStreak = 0; say(''); });
  v.addEventListener('error', () => {
    if (!order.length) return;
    errorStreak++;
    say(`Kan niet afspelen (codec/formaat?): ${cur()}`);
    if (errorStreak < 5 && order.length > 1) setTimeout(next, 1500);
  });

  $('next').onclick = next;
  $('prev').onclick = prev;
  $('del').onclick = del;
  $('rescan').onclick = () => load(order.length ? cur() : undefined);
  $('mode').onclick = () => {
    random = !random;
    localStorage.setItem('vs.random', random ? '1' : '0');
    const keep = order.length ? cur() : undefined;
    buildOrder(keep);
    render();
  };

  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    switch (e.key) {
      case 'n': case 'N': next(); break;
      case 'p': case 'P': prev(); break;
      case 'r': case 'R': $('mode').click(); break;
      case 'Delete': del(); break;
      case 'f': case 'F': document.fullscreenElement ? document.exitFullscreen() : v.requestFullscreen?.(); break;
      case ' ': e.preventDefault(); v.paused ? v.play() : v.pause(); break;
      case 'ArrowRight': e.preventDefault(); v.currentTime += 10; break;
      case 'ArrowLeft': e.preventDefault(); v.currentTime -= 10; break;
      default: return;
    }
  });

  if ('mediaSession' in navigator) {
    navigator.mediaSession.setActionHandler('nexttrack', next);
    navigator.mediaSession.setActionHandler('previoustrack', prev);
  }

  (async () => {
    try { cfg = await (await fetch('/api/config')).json(); } catch {}
    await load();
  })();
})();
</script>
</body>
</html>
